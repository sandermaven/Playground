<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
            letter-spacing: 4px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .score-board {
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
        }

        .score-board span {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #gameCanvas {
            border: 3px solid #0f0;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            background: #000;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .controls p {
            color: #888;
            font-size: 0.9rem;
        }

        button {
            background: linear-gradient(135deg, #0f0 0%, #0a0 100%);
            color: #000;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            margin-top: 20px;
        }

        .mobile-controls button {
            width: 60px;
            height: 60px;
            padding: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-controls button:nth-child(1) { grid-column: 2; grid-row: 1; }
        .mobile-controls button:nth-child(2) { grid-column: 1; grid-row: 2; }
        .mobile-controls button:nth-child(3) { grid-column: 3; grid-row: 2; }
        .mobile-controls button:nth-child(4) { grid-column: 2; grid-row: 3; }

        .overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 1.5rem;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            color: #f00;
            font-size: 2rem;
            text-shadow: 0 0 10px #f00;
        }

        .overlay .final-score {
            font-size: 1.2rem;
            color: #0f0;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 1.8rem;
            }

            .score-board {
                gap: 20px;
                font-size: 1rem;
            }

            .mobile-controls {
                display: grid;
            }

            .controls p {
                display: none;
            }
        }
    </style>
</head>
<body>
    <h1>SNAKE</h1>

    <div class="game-container">
        <div class="score-board">
            <span>Score: <strong id="score">0</strong></span>
            <span>High Score: <strong id="highScore">0</strong></span>
        </div>

        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="gameOverlay" class="overlay">
                <h2>GAME OVER</h2>
                <p class="final-score">Score: <span id="finalScore">0</span></p>
                <button onclick="startGame()">Play Again</button>
            </div>
            <div id="startOverlay" class="overlay">
                <h2 style="color: #0f0;">SNAKE GAME</h2>
                <p>Eat food to grow!</p>
                <button onclick="startGame()">Start Game</button>
            </div>
        </div>

        <div class="controls">
            <p>Use Arrow Keys or WASD to move</p>
            <button onclick="startGame()">New Game</button>
        </div>

        <div class="mobile-controls">
            <button onclick="changeDirection('up')">&#9650;</button>
            <button onclick="changeDirection('left')">&#9664;</button>
            <button onclick="changeDirection('right')">&#9654;</button>
            <button onclick="changeDirection('down')">&#9660;</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverlay = document.getElementById('gameOverlay');
        const startOverlay = document.getElementById('startOverlay');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null;
        let gameSpeed = 100;
        let isGameRunning = false;

        highScoreEl.textContent = highScore;

        function startGame() {
            // Reset game state
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameSpeed = 100;
            scoreEl.textContent = score;

            placeFood();

            // Hide overlays
            gameOverlay.classList.add('hidden');
            startOverlay.classList.add('hidden');

            // Start game loop
            if (gameLoop) clearInterval(gameLoop);
            isGameRunning = true;
            gameLoop = setInterval(gameUpdate, gameSpeed);
        }

        function placeFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        function gameUpdate() {
            // Update direction
            direction = { ...nextDirection };

            // Calculate new head position
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // Add new head
            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                placeFood();

                // Speed up slightly
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameUpdate, gameSpeed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (subtle)
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw food
            ctx.fillStyle = '#f00';
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw snake
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                const gradient = ctx.createRadialGradient(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    0,
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2
                );

                if (isHead) {
                    gradient.addColorStop(0, '#0f0');
                    gradient.addColorStop(1, '#080');
                    ctx.shadowColor = '#0f0';
                    ctx.shadowBlur = 15;
                } else {
                    const brightness = Math.max(0.3, 1 - (index / snake.length) * 0.7);
                    gradient.addColorStop(0, `rgba(0, ${Math.floor(255 * brightness)}, 0, 1)`);
                    gradient.addColorStop(1, `rgba(0, ${Math.floor(128 * brightness)}, 0, 1)`);
                    ctx.shadowBlur = 0;
                }

                ctx.fillStyle = gradient;
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );

                // Draw eyes on head
                if (isHead) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    const eyeOffset = 4;
                    const eyeSize = 3;

                    let eye1X, eye1Y, eye2X, eye2Y;

                    if (direction.x === 1) { // Right
                        eye1X = segment.x * gridSize + gridSize - 6;
                        eye1Y = segment.y * gridSize + 5;
                        eye2X = segment.x * gridSize + gridSize - 6;
                        eye2Y = segment.y * gridSize + gridSize - 8;
                    } else if (direction.x === -1) { // Left
                        eye1X = segment.x * gridSize + 4;
                        eye1Y = segment.y * gridSize + 5;
                        eye2X = segment.x * gridSize + 4;
                        eye2Y = segment.y * gridSize + gridSize - 8;
                    } else if (direction.y === -1) { // Up
                        eye1X = segment.x * gridSize + 5;
                        eye1Y = segment.y * gridSize + 4;
                        eye2X = segment.x * gridSize + gridSize - 8;
                        eye2Y = segment.y * gridSize + 4;
                    } else { // Down
                        eye1X = segment.x * gridSize + 5;
                        eye1Y = segment.y * gridSize + gridSize - 6;
                        eye2X = segment.x * gridSize + gridSize - 8;
                        eye2Y = segment.y * gridSize + gridSize - 6;
                    }

                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                    ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoop);
            gameLoop = null;

            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }

            finalScoreEl.textContent = score;
            gameOverlay.classList.remove('hidden');
        }

        function changeDirection(dir) {
            if (!isGameRunning) return;

            switch (dir) {
                case 'up':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'down':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'left':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'right':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    changeDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    changeDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    changeDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    changeDirection('right');
                    break;
                case ' ':
                    e.preventDefault();
                    if (!isGameRunning) startGame();
                    break;
            }
        });

        // Touch controls for mobile swipe
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!isGameRunning) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) changeDirection('right');
                else if (dx < -30) changeDirection('left');
            } else {
                if (dy > 30) changeDirection('down');
                else if (dy < -30) changeDirection('up');
            }
        }, { passive: true });

        // Initial draw
        draw();
    </script>
</body>
</html>
